name: Build APK

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to build
        required: true
        default: warcraft-2
        type: choice
        options: [dark-colony, dark-reign, 7legion, kknd, warcraft-2, starcraft, z]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      # Submodule tidak ikut saat upload zip ke GitHub, jadi SDL di-clone langsung.
      - name: Fetch SDL2 2.32.10
        run: |
          rm -rf third_party/SDL
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git third_party/SDL

      - name: Install SDK/NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'

      - name: Build debug APK
        working-directory: android
        run: |
          set -eu
          case "${{ inputs.game }}" in
            dark-colony) flavor=DarkColony;  dir=darkColony ;;
            dark-reign)  flavor=DarkReign;   dir=darkReign ;;
            7legion)     flavor=Legion;      dir=legion ;;
            kknd)        flavor=Kknd;        dir=kknd ;;
            warcraft-2)  flavor=Warcraft2;   dir=warcraft2 ;;
            starcraft)   flavor=Starcraft;   dir=starcraft ;;
            z)           flavor=Z;           dir=z ;;
          esac
          chmod +x gradlew
          ./gradlew --no-daemon assemble${flavor}Debug
          mkdir -p ../dist
          cp app/build/outputs/apk/$dir/debug/*.apk ../dist/open-rts-${{ inputs.game }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: open-rts-${{ inputs.game }}-apk
          path: dist/*.apk
          if-no-files-found: error
